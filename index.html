<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>TCL Home Comfort: Product Market Research</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#0f1720;--mute:#516070;--line:#d8dee6;--tcl:#1f5fbf;--comp:#c25a0c;--ok:#13703d;--okbg:#dff3e7;--warn:#8a5b00;--warnbg:#fff0c9;--no:#a3302b;--nobg:#fbe3e1;--chip:#e8edf2;--accent:#0f1720;--accink:#fff;--photo:#fff;--shadow:0 1px 2px rgba(15,23,32,.06),0 6px 18px rgba(15,23,32,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1115;--card:#161b21;--ink:#e9edf1;--mute:#9fabb7;--line:#2a323a;--tcl:#7db0ff;--comp:#f4a46d;--ok:#6fdc9c;--okbg:#12301f;--warn:#e8bd4a;--warnbg:#3a2f0e;--no:#f59a95;--nobg:#3a1816;--chip:#202830;--accent:#e9edf1;--accink:#0f1720;--photo:#eef1f4;--shadow:none}}
:root[data-theme="dark"]{--bg:#0d1115;--card:#161b21;--ink:#e9edf1;--mute:#9fabb7;--line:#2a323a;--tcl:#7db0ff;--comp:#f4a46d;--ok:#6fdc9c;--okbg:#12301f;--warn:#e8bd4a;--warnbg:#3a2f0e;--no:#f59a95;--nobg:#3a1816;--chip:#202830;--accent:#e9edf1;--accink:#0f1720;--photo:#eef1f4;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.banner{background:#0b1522;color:#c9d6e4;font-size:12px;padding:6px 0}
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0}
.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;min-height:38px;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.pill[aria-current="true"]{background:var(--accent);color:var(--accink);border-color:var(--accent)}
.pill svg{width:18px;height:18px}
.home{font-weight:800}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;margin:12px 0 18px;padding:26px 20px 22px;color:#fff;background:radial-gradient(120% 140% at 85% -10%,#1f7ae0 0%,rgba(31,122,224,0) 55%),radial-gradient(90% 90% at 0% 110%,#17b8a6 0%,rgba(23,184,166,0) 55%),#0b1b2e}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9fd8ff;font-weight:700}
.hero h1{font-size:clamp(30px,8.5vw,52px);line-height:1.04;margin:8px 0 10px;letter-spacing:-.02em}
.hero p{margin:0 0 16px;color:#d7e4f2;max-width:560px}
.hero .nums{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:22px;margin:0 0 18px}
.hero .nums b{display:block;font-size:30px;line-height:1}
.hero .nums span{font-size:12px;color:#b9cde2}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 20px;font-weight:700;text-decoration:none;font-size:16px;min-height:48px}
.btn.p{background:#fff;color:#0b1b2e}
.btn.s{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
h2{font-size:22px;margin:18px 0 4px}
h3{font-size:17px;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 12px}
.sec{margin:16px 0 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.sub{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.snap{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:2px 0 10px}
@media(min-width:700px){.snap{grid-template-columns:repeat(4,1fr)}}
.lgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.lgrid{grid-template-columns:1fr 1fr}}
.lcard{display:flex;gap:12px;align-items:flex-start}
.lcard .ph{flex:0 0 42%}
.lcard .info{flex:1;min-width:0}
.hint{font-size:12.5px;color:var(--mute);margin:2px 0 6px}
/* photos */
.ph{margin:0;position:relative}
.ph .frame{background:var(--photo);border-radius:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ph .fb{color:#7a8794;width:46%;height:46%}
.ph figcaption{font-size:11px;color:var(--mute);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.ph figcaption a{color:var(--tcl);font-weight:700;text-decoration:none}
.ph.sm .frame{aspect-ratio:16/10}
/* scoreboard cards */
.sb{display:block;text-decoration:none;color:var(--ink)}
.sb .nm{font-weight:800;margin:8px 0 2px}
.sb .vv{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-block;flex:0 0 auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.ahead{background:var(--okbg);color:var(--ok)}
.chip.even{background:var(--chip);color:var(--mute)}
.chip.behind{background:var(--nobg);color:var(--no)}
.chip.unclear{background:var(--warnbg);color:var(--warn)}
.tests{display:flex;gap:6px;flex-wrap:wrap}
.t{font-size:12.5px;font-weight:700;border-radius:8px;padding:4px 9px}
.t.yes{background:var(--okbg);color:var(--ok)}.t.partial{background:var(--warnbg);color:var(--warn)}.t.none{background:var(--nobg);color:var(--no)}
/* lineup */
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .p{font-weight:700;text-align:right;color:var(--tcl)}
.row .d{grid-column:1/3;color:var(--mute);font-size:14px}
.spec{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0}
.spec span:first-child{color:var(--mute)}
.spec span:last-child{text-align:right}
/* compare */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:13.5px}
.side.t1{border-top:4px solid var(--tcl)}.side.c1{border-top:4px solid var(--comp)}
.side small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.side b{display:block;margin-top:6px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sr{padding:10px 12px;border-bottom:1px solid var(--line)}
.sr:last-child{border:0}
.sr .a{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sr .v{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;margin-top:4px}
.sr .v small{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.key{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.bottom{margin-top:10px;border-left:4px solid var(--tcl);padding:10px 12px;background:var(--card);border-radius:0 12px 12px 0;font-weight:600}
/* ideas */
.price{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.step{display:flex;gap:12px;margin-bottom:10px}
.step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.step .b{flex:1}
.arrow{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pair .arrow{display:none}
.idea{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.idea .ph{flex:0 0 38%}
ul{margin:4px 0;padding-left:20px}li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px;box-shadow:var(--shadow)}
svg text{fill:var(--ink);font:12px system-ui,sans-serif}
svg .m{fill:var(--mute)}.bar-t{fill:var(--tcl)}.bar-c{fill:var(--comp)}
.legend{display:flex;gap:14px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--mute);margin:6px 0}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{padding:0 0 12px 16px;position:relative}
.tl li:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--comp)}
.tl b{display:block}
.src a{font-size:12.5px;color:var(--mute);margin-right:8px}
a{color:var(--tcl)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--mute)}
footer{margin:22px 0 28px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:12.5px}
.fade{animation:f .35s ease both}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

.ladder{width:100%;height:auto;display:block}
.ladder text{font:600 11px Inter,system-ui,sans-serif;fill:var(--ink)}
.ladder .m{font-weight:500;fill:var(--mute);font-size:10px}
.ladder .newband{animation:slidein 1.4s ease-out both}
.ladder .newlbl{animation:fadein 1.4s ease-out .5s both}
@keyframes slidein{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ladder .newband,.ladder .newlbl{animation:none}}
.ba{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}
.ba .rw{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.ba .hd{display:flex;gap:8px;align-items:center;padding:8px 12px;font-weight:800;border-bottom:1px solid var(--line)}
.ba .hd i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accink);font-style:normal;font-size:12px;display:grid;place-items:center}
.ba .cols{display:grid;grid-template-columns:1fr}
@media(min-width:640px){.ba .cols{grid-template-columns:1fr 1fr}}
.ba .b,.ba .a{padding:10px 12px;font-size:14px}
.ba .b{background:var(--nobg)}.ba .a{background:var(--okbg)}
.ba small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;margin-bottom:3px;opacity:.85}
.ba .b small{color:var(--no)}.ba .a small{color:var(--ok)}
.listing{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:14px}
.concept{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--warnbg);color:var(--warn);border-radius:999px;padding:3px 9px;margin-bottom:6px}

.anat{position:relative;max-width:460px;margin:0 auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.anat img{display:block;width:100%;height:auto}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--no);color:#fff;font:800 13px Inter,system-ui,sans-serif;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.tile b{display:block;font-size:19px;line-height:1.15}.tile span{font-size:12px;color:var(--mute)}
.parts{display:grid;gap:8px;margin-top:8px}
.part{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.part .nb{width:26px;height:26px;border-radius:50%;background:var(--no);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.part.keep .nb{background:var(--mute)}
.part .t{font-weight:800}.part .n{font-size:13.5px;margin-top:3px}
.part .n i{font-style:normal;font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-right:6px}
.part .now i{color:var(--no)}.part .chg i{color:var(--ok)}
.cpt text{font:700 11px Inter,system-ui,sans-serif;fill:var(--ink)}
.cpt .nb{fill:var(--ok)}.cpt .nt{fill:#fff;font-size:12px;font-weight:800;text-anchor:middle}

.rest{display:grid;gap:10px}
.rest .big{font-size:34px;font-weight:800;line-height:1}
.rest ul{margin:6px 0 0;padding-left:18px}.rest li{margin:4px 0;font-size:14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);margin-bottom:8px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.on{border-color:var(--ok);background:var(--okbg)}
.mock{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.mock img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.mock .ttl{font-weight:800;font-size:15px;line-height:1.3}
.mock .pr{font-size:20px;font-weight:800;margin-top:4px}
.mock .meta{font-size:12.5px;color:var(--mute);margin-top:2px}
</style>
</head>
<body>
<div class="banner"><div class="wrap" id="disc"></div></div>
<div class="top"><div class="wrap"><nav class="bar" id="nav" aria-label="Sections"></nav></div></div>
<main class="wrap fade" id="view"></main>
<div class="wrap"><footer>Built with AI assistance from public sources. Not affiliated with or endorsed by TCL. Product names and product photos belong to their owners and link back to the page they came from. Photos load from those pages, so one may occasionally be missing.</footer></div>
<script src="data/data.js"></script>
<script src="data/extra.js"></script>
<script>
(function(){
var D=window.DATA;
function esc(s){return String(s).replace(/: ([a-z])/g,function(m,c){return ": "+c.toUpperCase()}).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
var SMALL={a:1,an:1,and:1,as:1,at:1,but:1,by:1,for:1,in:1,of:1,on:1,or:1,the:1,to:1,vs:1,with:1,is:1};
function cap(w){return w.charAt(0).toUpperCase()+w.slice(1)}
function tc(s){var first=true;return String(s).replace(/(\S+)(\s*)/g,function(m,w,sp){
  var lead=first;first=false;
  var out=w.split("-").map(function(p,k){
    if(/[0-9]/.test(p)||/[A-Z]/.test(p.slice(1)))return p;
    var low=p.toLowerCase();if(SMALL[low]&&!(lead&&k===0))return p;return cap(p)}).join("-");
  if(/[:;]$/.test(w))first=true;
  return out+sp})}
function tcDom(root){Array.prototype.forEach.call(root.querySelectorAll("h1,h2,h3,.sec,.pill,.btn,.eyebrow,.nm"),function(el){Array.prototype.forEach.call(el.childNodes,function(n){if(n.nodeType===3&&n.nodeValue.trim())n.nodeValue=tc(n.nodeValue)})})}
$("disc").textContent="AI-assisted research by "+D.meta.author+" from public sources, still to be vetted. Not affiliated with or endorsed by TCL. As of "+D.meta.asOf+".";
var S='fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
var ICONS={
 window:'<rect x="8" y="16" width="48" height="32" rx="4"/><path d="M16 27h32M16 33h32M16 39h32"/><path d="M3 54h58"/>',
 heatpump:'<rect x="8" y="22" width="48" height="30" rx="4"/><path d="M16 33h32M16 39h32M16 45h32"/><path d="M18 12q4-5 8 0t8 0 8 0"/><path d="M3 58h58"/>',
 ttw:'<rect x="4" y="8" width="56" height="48" rx="2"/><rect x="14" y="24" width="36" height="16" rx="3"/><path d="M20 30h24M20 35h24"/>',
 portable:'<rect x="20" y="6" width="22" height="46" rx="7"/><path d="M26 16h10M26 22h10"/><circle cx="26" cy="58" r="3"/><circle cx="37" cy="58" r="3"/><path d="M42 22c14 0 14 18 2 18"/>',
 dehum:'<rect x="12" y="8" width="40" height="48" rx="7"/><path d="M32 20c-8 10-8 16 0 18 8-2 8-8 0-18z"/><path d="M20 46h24M20 51h24"/>',
 purifier:'<rect x="18" y="16" width="28" height="40" rx="9"/><path d="M26 28h12M26 34h12M26 40h12"/><path d="M22 8q4-4 8 0M34 8q4-4 8 0"/>',
 split:'<rect x="6" y="12" width="52" height="20" rx="7"/><path d="M14 26h36"/><path d="M18 40q3 4 0 8M30 40q3 4 0 8M42 40q3 4 0 8"/>',
 lineup:'<rect x="8" y="10" width="20" height="20" rx="4"/><rect x="36" y="10" width="20" height="20" rx="4"/><rect x="8" y="38" width="20" height="16" rx="4"/><rect x="36" y="38" width="20" height="16" rx="4"/>',
 compare:'<path d="M12 12v40M52 12v40M12 32h40"/><path d="M22 22l-10 10 10 10M42 22l10 10-10 10"/>',
 grow:'<path d="M10 52h44"/><path d="M12 44l14-14 10 8 16-22"/><path d="M42 16h10v10"/>',
 voice:'<path d="M8 14h48v28H30l-10 10V42H8z"/><path d="M18 24h28M18 32h18"/>',
 trap:'<path d="M32 8l24 44H8z"/><path d="M32 24v14"/><circle cx="32" cy="45" r="1.5"/>',
 method:'<circle cx="32" cy="32" r="22"/><path d="M22 33l8 8 14-16"/>'
};
function icon(n,cls){return '<svg class="'+(cls||'')+'" viewBox="0 0 64 64" '+S+' aria-hidden="true">'+(ICONS[n]||"")+'</svg>'}
window.__fb=function(el,ic){var d=document.createElement("div");d.innerHTML=icon(ic,"fb");el.parentNode.replaceChild(d.firstChild,el)};
// photo with link and credit; falls back to a drawing
function photo(key,ic,sm){
  var m=D.media[key]||{};
  var h='<figure class="ph'+(sm?" sm":"")+'"><div class="frame">';
  h+=m.img?'<img src="'+esc(m.img)+'" alt="'+esc(key)+' product photo" loading="lazy" referrerpolicy="no-referrer" onerror="__fb(this,\''+ic+'\')">':icon(ic,"fb");
  h+='</div><figcaption><span>'+(m.img?'Photo: '+esc(m.by):'No photo, drawing')+'</span>'+(m.link?'<a href="'+esc(m.link)+'" target="_blank" rel="noopener" aria-label="View product page">View &#8599;</a>':"")+'</figcaption></figure>';
  return h;
}
var VIEWS=[
 {id:"lineup",name:"What TCL sells",short:"Lineup",icon:"lineup"},
 {id:"compare",name:"How TCL compares",short:"Compare",icon:"compare"},
 {id:"voice",name:"What customers say",short:"Customers",icon:"voice"},
 {id:"grow",name:"New product ideas",short:"New products",icon:"grow"},
 {id:"ruledout",name:"What I ruled out",short:"Ruled out",icon:"trap"},
 {id:"process",name:"How I research",short:"How I research",icon:"method"},
 {id:"roadmap",name:"From research to roadmap",short:"Roadmap",icon:"lineup"},
 {id:"casestudy",name:"Case study",short:"Case study",icon:"grow"}
];
var order=[],idx={};
function sref(id){if(!(id in idx)){idx[id]=order.length;order.push(id)}return idx[id]+1}
function srcs(a){return '<div class="src">'+a.map(function(s){var x=D.sources[s];return x?'<a href="'+esc(x[1])+'" target="_blank" rel="noopener">['+sref(s)+'] '+esc(x[0].length>34?x[0].slice(0,34)+"...":x[0])+'</a>':""}).join("")+'</div>'}
function pills(items,cur,base){return '<div class="sub" role="tablist">'+items.map(function(i){return '<a class="pill" role="tab" href="#/'+base+'/'+i.id+'" aria-current="'+(i.id===cur?"true":"false")+'">'+(i.icon?icon(i.icon):"")+esc(i.name)+'</a>'}).join("")+'</div>'}
var CATS=D.categories.map(function(c){return {id:c.id,name:c.name,icon:c.id}});
function cat(id){return D.categories.filter(function(c){return c.id===id})[0]}
function catPhotoKey(c){for(var i=0;i<c.tcl.length;i++){var m=D.media[c.tcl[i].model];if(m&&m.img)return c.tcl[i].model}return c.tcl[0].model}
function nav(cur){
  var h='<a class="pill home" href="#/" aria-current="'+(cur==="home"?"true":"false")+'">Home</a>';

/* charts */
function heatChart(){
  var W=420,H=230,Lm=48,R=12,T=10,B=36,ymax=12000;
  function X(t){return Lm+(t/50)*(W-Lm-R)}function Y(v){return H-B-(v/ymax)*(H-T-B)}
  var s='<div class="legend"><span><i class="sw" style="background:var(--tcl)"></i>TCL H12W4KWH</span><span><i class="sw" style="background:var(--comp)"></i>Gradient</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Heating output at 47 and 5 degrees F">';
  [0,3000,6000,9000,12000].forEach(function(v){s+='<line x1="'+Lm+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text class="m" x="'+(Lm-5)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(v/1000)+'k</text>'});
  [0,10,20,30,40,50].forEach(function(t){s+='<text class="m" x="'+X(t)+'" y="'+(H-B+16)+'" text-anchor="middle">'+t+'°F</text>'});
  s+='<text class="m" x="'+((Lm+W-R)/2)+'" y="'+(H-4)+'" text-anchor="middle">Outdoor temperature</text>';
  function line(d,col,dy){var r='<polyline fill="none" stroke="'+col+'" stroke-width="3" points="'+d.map(function(p){return X(p[0])+","+Y(p[1])}).join(" ")+'"/>';d.forEach(function(p){r+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="'+col+'"/><text x="'+(X(p[0])+(p[0]>40?-8:8))+'" y="'+(Y(p[1])+dy)+'" text-anchor="'+(p[0]>40?'end':'start')+'">'+p[1].toLocaleString()+' BTU</text>'});return r}
  s+=line(D.heat.tcl,"var(--tcl)",-9)+line(D.heat.gradient,"var(--comp)",18)+'</svg><div class="note">'+esc(D.heat.note)+'</div>';
  return '<div class="chart">'+s+'</div>';
}
function pintChart(){
  var W=420,rowH=58,H=rowH*D.pints.length+8,max=80;function w(v){return v/max*(W-150)}
  var s='<div class="legend"><span><i class="sw" style="background:var(--comp)"></i>Old label</span><span><i class="sw" style="background:var(--tcl)"></i>Same machine, current label</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Old and new pint ratings">';
  D.pints.forEach(function(p,i){var y=i*rowH+4;
    s+='<text x="0" y="'+(y+17)+'">Old '+p.old+'</text><rect class="bar-c" x="62" y="'+y+'" width="'+w(p.old)+'" height="22" rx="3"/><text x="'+(68+w(p.old))+'" y="'+(y+16)+'">'+p.old+'</text>';
    s+='<text x="0" y="'+(y+45)+'">Now '+p.nw+'</text><rect class="bar-t" x="62" y="'+(y+28)+'" width="'+w(p.nw)+'" height="22" rx="3"/><text x="'+(68+w(p.nw))+'" y="'+(y+44)+'">'+p.nw+'</text>'});
  return '<div class="chart">'+s+'</svg><div class="note">The 2020 rule lowered the test temperature, so the same machine now gets a smaller pint number. TCL support maps its 50-pint to the old 70-pint. <a href="'+esc(D.sources.tcl_pint[1])+'" target="_blank" rel="noopener">['+sref("tcl_pint")+']</a></div></div>';
}
function priceChart(){
  var rowH=32,W=420,Lm=178,max=2000,H=rowH*D.prices.length+6;
  var s='<div class="legend"><span><i class="sw" style="background:var(--tcl)"></i>TCL</span><span><i class="sw" style="background:var(--comp)"></i>Competitor</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Prices">';
  D.prices.forEach(function(p,i){var y=i*rowH+3,w=(p.v/max)*(W-Lm-52);
    s+='<text x="'+(Lm-6)+'" y="'+(y+16)+'" text-anchor="end" style="font-size:10.5px">'+esc(p.label)+'</text><rect class="'+(p.brand==="tcl"?"bar-t":"bar-c")+'" x="'+Lm+'" y="'+y+'" width="'+w+'" height="22" rx="3"/><text x="'+(Lm+w+5)+'" y="'+(y+16)+'" style="font-size:11px">$'+Math.round(p.v).toLocaleString()+'</text>'});
  return '<div class="chart">'+s+'</svg><div class="note">Different sizes and rating bases, so read as price tiers. Midea U sold for $280 to $500 before its recall.</div></div>';
}
