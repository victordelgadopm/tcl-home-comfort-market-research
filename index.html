<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>TCL Home Comfort Research</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#12171c;--mute:#525c66;--line:#d6dce2;--tcl:#1f5fbf;--comp:#b8560b;--ok:#17703f;--okbg:#e3f4ea;--warn:#8a5b00;--warnbg:#fff0cc;--no:#a3302b;--nobg:#fbe5e3;--chip:#e9edf1;--banner:#fff6d6;--bannerink:#4a3a00;--accent:#12171c;--accink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1316;--card:#171c20;--ink:#e8ebee;--mute:#a0aab3;--line:#2c343a;--tcl:#7db0ff;--comp:#f2a46b;--ok:#6fdc9c;--okbg:#14301f;--warn:#e8bd4a;--warnbg:#3a2f0e;--no:#f59a95;--nobg:#3a1816;--chip:#222a30;--banner:#3a3210;--bannerink:#f3e6a8;--accent:#e8ebee;--accink:#12171c}}
:root[data-theme="dark"]{--bg:#0f1316;--card:#171c20;--ink:#e8ebee;--mute:#a0aab3;--line:#2c343a;--tcl:#7db0ff;--comp:#f2a46b;--ok:#6fdc9c;--okbg:#14301f;--warn:#e8bd4a;--warnbg:#3a2f0e;--no:#f59a95;--nobg:#3a1816;--chip:#222a30;--banner:#3a3210;--bannerink:#f3e6a8;--accent:#e8ebee;--accink:#12171c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.banner{background:var(--banner);color:var(--bannerink);font-size:12.5px;padding:7px 0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 0;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:42px;display:inline-flex;gap:7px;align-items:center;text-decoration:none}
.pill[aria-current="true"]{background:var(--accent);color:var(--accink);border-color:var(--accent)}
.pill svg{width:20px;height:20px}
.home{font-weight:800}
h1{font-size:clamp(24px,6.4vw,38px);line-height:1.12;margin:14px 0 6px}
h2{font-size:22px;margin:14px 0 4px}
h3{font-size:17px;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 18px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tiles .tile{flex-direction:column;align-items:flex-start;gap:6px;min-height:128px}
.tiles .tile .go{display:none}
.tiles .tile b{font-size:16px}
.tiles .tile span{font-size:13px;line-height:1.3}
.tile{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);min-height:76px}
.tile:active{transform:scale(.985)}
.tile .ic{flex:0 0 40px;width:40px;height:40px;color:var(--tcl)}
.tile b{display:block;font-size:17px}
.tile span{color:var(--mute);font-size:14px}
.tile .go{margin-left:auto;font-size:22px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mute)}
.sub{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.hero .ic{flex:0 0 84px;height:84px;color:var(--tcl);background:var(--chip);border-radius:16px;padding:10px}
.hero small{color:var(--mute)}
.snap{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.snap>.card{flex:0 0 82%;max-width:340px;scroll-snap-align:start}
.hint{font-size:12.5px;color:var(--mute);margin:2px 0 6px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row b{font-size:16px}
.row .p{font-weight:700;text-align:right;color:var(--tcl)}
.row .d{grid-column:1/3;color:var(--mute);font-size:14px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13.5px}
.side.t{border-top:4px solid var(--tcl)}.side.c{border-top:4px solid var(--comp)}
.side small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.side b{display:block}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sr{padding:10px 12px;border-bottom:1px solid var(--line)}
.sr:last-child{border:0}
.sr .a{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sr .v{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;margin-top:4px}
.sr .v div small{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.chip{display:inline-block;flex:0 0 auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.ahead{background:var(--okbg);color:var(--ok)}
.chip.even{background:var(--chip);color:var(--mute)}
.chip.behind{background:var(--nobg);color:var(--no)}
.chip.unclear{background:var(--warnbg);color:var(--warn)}
.bottom{margin-top:10px;border-left:4px solid var(--tcl);padding:8px 12px;background:var(--card);border-radius:0 10px 10px 0;font-weight:600}
.key{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.price{font-size:34px;font-weight:800;line-height:1.1;margin:2px 0}
.big{display:grid;gap:10px}
.sec{margin:12px 0 4px;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:700}
ul{margin:4px 0;padding-left:20px}li{margin:4px 0}
.tests{display:flex;gap:6px;flex-wrap:wrap}
.t{font-size:12.5px;font-weight:700;border-radius:8px;padding:4px 9px}
.t.yes{background:var(--okbg);color:var(--ok)}.t.partial{background:var(--warnbg);color:var(--warn)}.t.none{background:var(--nobg);color:var(--no)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;vertical-align:top;padding:8px 9px;border-bottom:1px solid var(--line)}
th{background:var(--chip);font-size:12.5px}
.scroll{overflow-x:auto}
svg text{fill:var(--ink);font:12px system-ui,sans-serif}
svg .m{fill:var(--mute)}.bar-t{fill:var(--tcl)}.bar-c{fill:var(--comp)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.legend{display:flex;gap:14px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--mute);margin:6px 0}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{padding:0 0 12px 16px;position:relative}
.tl li:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--comp)}
.tl b{display:block}
.src a{font-size:12.5px;color:var(--mute);margin-right:8px}
a{color:var(--tcl)}
footer{margin:22px 0 28px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:12.5px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--mute)}
</style>
</head>
<body>
<div class="banner"><div class="wrap" id="disc"></div></div>
<div class="top"><div class="wrap"><nav class="bar" id="nav" aria-label="Sections"></nav></div></div>
<main class="wrap" id="view"></main>
<div class="wrap"><footer>Built with AI assistance from public sources. Not affiliated with or endorsed by TCL. Product names belong to their owners. Illustrations are my own simple drawings, not product photos.</footer></div>
<script src="data/data.js"></script>
<script src="data/extra.js"></script>
<script>
(function(){
var D=window.DATA;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
$("disc").textContent="Independent research by "+D.meta.author+" from public sources. Not affiliated with or endorsed by TCL. As of "+D.meta.asOf+".";

var S='fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
var ICONS={
 window:'<rect x="8" y="16" width="48" height="32" rx="4"/><path d="M16 27h32M16 33h32M16 39h32"/><path d="M3 54h58"/>',
 heatpump:'<rect x="8" y="22" width="48" height="30" rx="4"/><path d="M16 33h32M16 39h32M16 45h32"/><path d="M18 12q4-5 8 0t8 0 8 0"/><path d="M3 58h58"/>',
 ttw:'<rect x="4" y="8" width="56" height="48" rx="2"/><rect x="14" y="24" width="36" height="16" rx="3"/><path d="M20 30h24M20 35h24"/>',
 portable:'<rect x="20" y="6" width="22" height="46" rx="7"/><path d="M26 16h10M26 22h10"/><circle cx="26" cy="58" r="3"/><circle cx="37" cy="58" r="3"/><path d="M42 22c14 0 14 18 2 18"/>',
 dehum:'<rect x="12" y="8" width="40" height="48" rx="7"/><path d="M32 20c-8 10-8 16 0 18 8-2 8-8 0-18z"/><path d="M20 46h24M20 51h24"/>',
 purifier:'<rect x="18" y="16" width="28" height="40" rx="9"/><path d="M26 28h12M26 34h12M26 40h12"/><path d="M22 8q4-4 8 0M34 8q4-4 8 0"/>',
 split:'<rect x="6" y="12" width="52" height="20" rx="7"/><path d="M14 26h36"/><path d="M18 40q3 4 0 8M30 40q3 4 0 8M42 40q3 4 0 8"/>',
 lineup:'<rect x="8" y="10" width="20" height="20" rx="4"/><rect x="36" y="10" width="20" height="20" rx="4"/><rect x="8" y="38" width="20" height="16" rx="4"/><rect x="36" y="38" width="20" height="16" rx="4"/>',
 compare:'<path d="M12 12v40M52 12v40M12 32h40"/><path d="M22 22l-10 10 10 10M42 22l10 10-10 10"/>',
 grow:'<path d="M10 52h44"/><path d="M12 44l14-14 10 8 16-22"/><path d="M42 16h10v10"/>',
 voice:'<path d="M8 14h48v28H30l-10 10V42H8z"/><path d="M18 24h28M18 32h18"/>',
 trap:'<path d="M32 8l24 44H8z"/><path d="M32 24v14"/><circle cx="32" cy="45" r="1.5"/>',
 method:'<circle cx="32" cy="32" r="22"/><path d="M22 33l8 8 14-16"/>'
};
function icon(n,cls){return '<svg class="'+(cls||'')+'" viewBox="0 0 64 64" '+S+' aria-hidden="true">'+(ICONS[n]||"")+'</svg>'}

var VIEWS=[
 {id:"lineup",name:"What TCL sells",short:"Lineup",icon:"lineup",desc:"7 product lines and what you get as the price goes up"},
 {id:"compare",name:"How TCL compares",short:"Compare",icon:"compare",desc:"Where TCL is ahead, even or behind competitors"},
 {id:"grow",name:"Where TCL could grow",short:"Grow",icon:"grow",desc:"5 ideas with a price to test, and fixes to today's products"},
 {id:"voice",name:"What customers say",short:"Customers",icon:"voice",desc:"Review themes, with how thin the evidence is"},
 {id:"traps",name:"Traps I avoided",short:"Traps",icon:"trap",desc:"A recalled design, a rating change, and ideas set aside"},
 {id:"method",name:"How sure I am",short:"Method",icon:"method",desc:"What is unconfirmed, what comes next, and every source"}
];
var order=[],idx={};
function sref(id){if(!(id in idx)){idx[id]=order.length;order.push(id)}return idx[id]+1}
function srcs(a){return '<div class="src">'+a.map(function(s){var x=D.sources[s];return x?'<a href="'+esc(x[1])+'" target="_blank" rel="noopener">['+sref(s)+'] '+esc(x[0].length>34?x[0].slice(0,34)+"...":x[0])+'</a>':""}).join("")+'</div>'}
function pills(items,cur,base){return '<div class="sub" role="tablist">'+items.map(function(i){return '<a class="pill" role="tab" href="#/'+base+'/'+i.id+'" aria-current="'+(i.id===cur?"true":"false")+'">'+(i.icon?icon(i.icon):"")+esc(i.name)+'</a>'}).join("")+'</div>'}
var CATS=D.categories.map(function(c){return {id:c.id,name:c.name,icon:c.id}});
function cat(id){return D.categories.filter(function(c){return c.id===id})[0]}

function nav(cur){
  var h='<a class="pill home" href="#/" aria-current="'+(cur==="home"?"true":"false")+'">Home</a>';
  VIEWS.forEach(function(v){h+='<a class="pill" href="#/'+v.id+'" aria-current="'+(cur===v.id?"true":"false")+'">'+esc(v.short)+'</a>'});
  $("nav").innerHTML=h;
}

function home(){
  var h='<h1>TCL Home Comfort market research</h1><p class="lead">What they sell, how they compare, where they could grow. Tap a section.</p>';
  h+='<div class="card"><b>The short version:</b> TCL already sells a 12K window heat pump. The clearest gap is one built to stay in the window all winter, which a competitor already sells.</div>';
  h+='<div class="tiles">'+VIEWS.map(function(v){return '<a class="tile" href="#/'+v.id+'">'+icon(v.icon,"ic")+'<div><b>'+esc(v.name)+'</b><span>'+esc(v.desc)+'</span></div><span class="go">&rsaquo;</span></a>'}).join("")+'</div>';
  return h;
}

function lineup(sub){
  var id=sub||"window";var c=cat(id),L=D.ladder[id];
  var h='<h2>What TCL sells</h2><p class="lead">Pick a product line.</p>'+pills(CATS,id,"lineup");
  h+='<div class="hero">'+icon(id,"ic")+'<div><h3>'+esc(c.name)+'</h3><small>'+esc(L.lead)+'</small></div></div>';
  h+='<div class="sec">As the price goes up</div><div class="card">'+L.rows.map(function(r){return '<div class="row"><b>'+esc(r[0])+'</b><span class="p">'+esc(r[1])+'</span><span class="d">'+esc(r[2])+'</span></div>'}).join("")+'</div>';
  h+='<div class="sec">TCL models I found</div><div class="hint">Swipe to see more</div><div class="snap">'+c.tcl.map(function(p){
    return '<div class="card"><b>'+esc(p.model)+'</b><div class="note" style="margin-top:0">'+esc(p.name)+'</div>'+p.specs.map(function(s){return '<div class="row" style="padding:5px 0"><span class="d" style="grid-column:auto;color:var(--mute)">'+esc(s[0])+'</span><span style="text-align:right;font-size:14px">'+esc(s[1])+'</span></div>'}).join("")+(p.note?'<div class="note">'+esc(p.note)+'</div>':"")+'</div>'}).join("")+'</div>';
  h+=srcs(L.src);
  return h;
}

function heatChart(){
  var W=420,H=230,Lm=48,R=12,T=10,B=36,ymax=12000;
  function X(t){return Lm+(t/50)*(W-Lm-R)}function Y(v){return H-B-(v/ymax)*(H-T-B)}
  var s='<div class="legend"><span><i class="sw" style="background:var(--tcl)"></i>TCL H12W4KWH</span><span><i class="sw" style="background:var(--comp)"></i>Gradient</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Heating output at 47 and 5 degrees F">';
  [0,3000,6000,9000,12000].forEach(function(v){s+='<line x1="'+Lm+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text class="m" x="'+(Lm-5)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(v/1000)+'k</text>'});
  [0,10,20,30,40,50].forEach(function(t){s+='<text class="m" x="'+X(t)+'" y="'+(H-B+16)+'" text-anchor="middle">'+t+'°F</text>'});
  s+='<text class="m" x="'+((Lm+W-R)/2)+'" y="'+(H-4)+'" text-anchor="middle">Outdoor temperature</text>';
  function line(d,col,dy){var r='<polyline fill="none" stroke="'+col+'" stroke-width="3" points="'+d.map(function(p){return X(p[0])+","+Y(p[1])}).join(" ")+'"/>';d.forEach(function(p){r+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="'+col+'"/><text x="'+(X(p[0])+(p[0]>40?-8:8))+'" y="'+(Y(p[1])+dy)+'" text-anchor="'+(p[0]>40?'end':'start')+'">'+p[1].toLocaleString()+'</text>'});return r}
  s+=line(D.heat.tcl,"var(--tcl)",-9)+line(D.heat.gradient,"var(--comp)",18)+'</svg><div class="note">'+esc(D.heat.note)+'</div>';
  return '<div class="chart">'+s+'</div>';
}
function pintChart(){
  var W=420,rowH=58,H=rowH*D.pints.length+8,max=80;function w(v){return v/max*(W-150)}
  var s='<div class="legend"><span><i class="sw" style="background:var(--comp)"></i>Old label</span><span><i class="sw" style="background:var(--tcl)"></i>Same machine, current label</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Old and new pint ratings">';
  D.pints.forEach(function(p,i){var y=i*rowH+4;
    s+='<text x="0" y="'+(y+17)+'">Old '+p.old+'</text><rect class="bar-c" x="62" y="'+y+'" width="'+w(p.old)+'" height="22" rx="3"/><text x="'+(68+w(p.old))+'" y="'+(y+16)+'">'+p.old+'</text>';
    s+='<text x="0" y="'+(y+45)+'">Now '+p.nw+'</text><rect class="bar-t" x="62" y="'+(y+28)+'" width="'+w(p.nw)+'" height="22" rx="3"/><text x="'+(68+w(p.nw))+'" y="'+(y+44)+'">'+p.nw+'</text>'});
  return '<div class="chart">'+s+'</svg><div class="note">The 2020 rule lowered the test temperature, so the same machine now gets a smaller pint number. TCL support maps its 50-pint to the old 70-pint. '+'<a href="'+esc(D.sources.tcl_pint[1])+'" target="_blank" rel="noopener">['+sref("tcl_pint")+']</a></div></div>';
}
function priceChart(){
  var rowH=32,W=420,Lm=178,max=2000,H=rowH*D.prices.length+6;
  var s='<div class="legend"><span><i class="sw" style="background:var(--tcl)"></i>TCL</span><span><i class="sw" style="background:var(--comp)"></i>Competitor</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Prices">';
  D.prices.forEach(function(p,i){var y=i*rowH+3,w=(p.v/max)*(W-Lm-52);var lb=p.label.replace(/^(Dehumidifier|Window|Portable|Through-the-wall)/,"$1");
    s+='<text x="'+(Lm-6)+'" y="'+(y+16)+'" text-anchor="end" style="font-size:10.5px">'+esc(lb)+'</text><rect class="'+(p.brand==="tcl"?"bar-t":"bar-c")+'" x="'+Lm+'" y="'+y+'" width="'+w+'" height="22" rx="3"/><text x="'+(Lm+w+5)+'" y="'+(y+16)+'" style="font-size:11px">$'+Math.round(p.v).toLocaleString()+'</text>'});
  return '<div class="chart">'+s+'</svg><div class="note">Different sizes and rating bases, so read as price tiers. Midea U sold for $280 to $500 before its recall.</div></div>';
}

var VL={ahead:"TCL ahead",even:"Even",behind:"TCL behind",unclear:"Not confirmed"};
var VS={ahead:"▲ ",even:"= ",behind:"▼ ",unclear:"? "};
function compare(sub){
  var id=sub||"window";
  var items=CATS.concat([{id:"prices",name:"Price chart",icon:"grow"}]);
  var h='<h2>How TCL compares</h2><p class="lead">Pick a product line. Each row says if TCL is ahead, even or behind.</p>'+pills(items,id,"compare");
  if(id==="prices"){return h+'<h3>Price tiers</h3>'+priceChart()}
  var sc=D.score[id],c=cat(id);
  h+='<div class="key"><span class="chip ahead">▲ TCL ahead</span><span class="chip even">= Even</span><span class="chip behind">▼ TCL behind</span><span class="chip unclear">? Not confirmed</span></div>';
  if(!sc.rows.length){return h+'<div class="hero">'+icon(id,"ic")+'<div><h3>'+esc(c.name)+'</h3><small>Not compared yet</small></div></div><div class="bottom">'+esc(sc.bottom)+'</div>'}
  h+='<div class="vs"><div class="side t">'+icon(id,"")+'<small>TCL</small><b>'+esc(sc.tclL)+'</b></div><div class="side c">'+icon(id==="heatpump"?"heatpump":id,"")+'<small>Competitor</small><b>'+esc(sc.compL)+'</b></div></div>';
  h=h.replace(/<div class="side (t|c)">(<svg[^>]*>)/g,function(m,k,sv){return '<div class="side '+k+'">'+sv.replace('<svg','<svg style="width:38px;height:38px;color:var(--'+(k==="t"?"tcl":"comp")+')"')});
  h+='<div class="sc">'+sc.rows.map(function(r){return '<div class="sr"><div class="a"><span>'+esc(r[0])+'</span><span class="chip '+r[3]+'">'+VS[r[3]]+VL[r[3]]+'</span></div><div class="v"><div><small>TCL</small>'+esc(r[1])+'</div><div><small>Competitor</small>'+esc(r[2])+'</div></div></div>'}).join("")+'</div>';
  h+='<div class="bottom">'+esc(sc.bottom)+'</div>';
  if(id==="heatpump")h+=heatChart();
  if(id==="dehum")h+=pintChart();
  var all=[];c.tcl.concat(c.comp).forEach(function(p){p.src.forEach(function(s){if(all.indexOf(s)<0)all.push(s)})});
  h+='<div class="sec">Sources</div>'+srcs(all);
  return h;
}

var IDEAS=D.ideas;var lab={yes:["Yes","yes"],partial:["Partial","partial"],none:["None found","none"]};
function grow(sub){
  var items=[{id:"all",name:"All 5 ideas"}].concat(IDEAS.map(function(i){return {id:String(i.n),name:"Idea "+i.n}})).concat([{id:"fixes",name:"Fixes"}]);
  var id=sub||"all";
  var h='<h2>Where TCL could grow</h2><p class="lead">Each idea shows what is different, why, and a price to test.</p>'+pills(items,id,"grow");
  if(id==="all"){
    h+='<div class="hint">Tap an idea for the detail</div>';
    h+=IDEAS.map(function(i){var g=D.grow[i.n];return '<a class="tile" href="#/grow/'+i.n+'" style="margin-bottom:8px;align-items:flex-start"><div style="flex:1"><b>'+i.n+'. '+esc(i.h)+'</b><div class="tests" style="margin:6px 0"><span class="t '+lab[i.gap][1]+'">Gap: '+lab[i.gap][0]+'</span><span class="t '+lab[i.comp][1]+'">Competitor: '+lab[i.comp][0]+'</span><span class="t '+lab[i.sig][1]+'">Customers: '+lab[i.sig][0]+'</span></div><span>Price to test: <b style="color:var(--ink)">'+esc(g.price)+'</b> | '+esc(i.read)+'</span></div><span class="go">&rsaquo;</span></a>'}).join("");
    h+='<div class="note">Price ranges are my starting points to test, built from the prices I found. They are not forecasts.</div>';
    return h;
  }
  if(id==="fixes"){
    h+='<div class="hint">Updates to what TCL sells today, from what customers report</div>';
    h+=D.fixes.map(function(f){return '<div class="card" style="margin-bottom:8px"><b>'+esc(f[0])+'</b><div class="sec" style="margin:6px 0 2px">What customers report</div>'+esc(f[1])+'<div class="sec" style="margin:8px 0 2px">Possible fix</div><b>'+esc(f[2])+'</b></div>'}).join("");
    return h;
  }
  var i=IDEAS.filter(function(x){return String(x.n)===id})[0],g=D.grow[i.n];
  var iconId=["heatpump","heatpump","ttw","portable","dehum"][i.n-1];
  h+='<div class="hero">'+icon(iconId,"ic")+'<div><h3>'+i.n+'. '+esc(i.h)+'</h3><small>'+esc(i.read)+'</small></div></div>';
  h+='<div class="big"><div class="card"><div class="sec" style="margin-top:0">What it is</div>'+esc(g.what)+'<div class="sec">What is different</div>'+esc(g.diff)+'</div>';
  h+='<div class="card"><div class="sec" style="margin-top:0">Price to test</div><div class="price">'+esc(g.price)+'</div><div class="note">'+esc(g.basis)+'</div></div>';
  h+='<div class="card"><div class="sec" style="margin-top:0">Three tests</div><div class="tests"><span class="t '+lab[i.gap][1]+'">TCL gap: '+lab[i.gap][0]+'</span><span class="t '+lab[i.comp][1]+'">Competitor sells it: '+lab[i.comp][0]+'</span><span class="t '+lab[i.sig][1]+'">Customer signal: '+lab[i.sig][0]+'</span></div><div class="sec">Why</div><ul>'+g.bullets.map(function(b){return '<li>'+esc(b)+'</li>'}).join("")+'</ul></div>';
  h+='<div class="card"><div class="sec" style="margin-top:0">What I would check next</div>'+esc(i.test)+'</div></div>';
  var nx=IDEAS[i.n%IDEAS.length].n;
  h+='<p style="text-align:right"><a class="pill" href="#/grow/'+nx+'">Next idea &rsaquo;</a></p>';
  return h;
}

function voice(sub){
  var items=D.voice.map(function(v,i){return {id:String(i),name:v.h}});var id=sub||"0";var v=D.voice[+id];
  var h='<h2>What customers say</h2><p class="lead">Small samples, and many retailer reviews were incentivized. Treat these as themes to check, not proof.</p>'+pills(items,id,"voice");
  h+='<div class="card"><h3>'+esc(v.h)+'</h3><p>'+esc(v.t)+'</p><span class="tag">Evidence: '+esc(v.s)+'</span></div>';
  return h;
}

function traps(sub){
  var items=[{id:"ushape",name:"U-shape recall"},{id:"pints",name:"Pint ratings"},{id:"aside",name:"Set aside"}];var id=sub||"ushape";
  var h='<h2>Traps I avoided</h2><p class="lead">Things that look like opportunities but are not.</p>'+pills(items,id,"traps");
  if(id==="ushape"){
    h+='<div class="card"><h3>Midea U-shaped window unit</h3><p class="note" style="margin-top:0">A competing design. Recalled, so not a design to copy.</p><ul class="tl">'+D.timeline.map(function(t){return '<li><b>'+esc(t.d)+'</b>'+esc(t.t)+'</li>'}).join("")+'</ul></div>';
    h+='<div class="card" style="margin-top:10px"><h3>Patents</h3><p style="margin:0">'+esc(D.patents)+'</p></div>';
    h+=srcs(["cpsc","classaction","aftermath","patent1","patent2"]);
  } else if(id==="pints"){
    h+='<h3>Same machine, different number</h3>'+pintChart();
  } else {
    h+='<div class="hint">Looked at, then dropped</div>'+D.setaside.map(function(r){return '<div class="card" style="margin-bottom:8px"><b>'+esc(r[0])+'</b><div style="color:var(--mute);font-size:14px;margin-top:2px">'+esc(r[1])+'</div></div>'}).join("");
  }
  return h;
}

function method(sub){
  var items=[{id:"unc",name:"Not confirmed"},{id:"next",name:"Now and after"},{id:"src",name:"Sources"}];var id=sub||"unc";
  var h='<h2>How sure I am</h2><p class="lead">What I could not confirm, what comes next, and where everything came from.</p>'+pills(items,id,"method");
  if(id==="unc"){h+='<div class="card"><ul>'+D.unconfirmed.map(function(u){return '<li>'+esc(u)+'</li>'}).join("")+'</ul></div>'}
  else if(id==="next"){h+='<div class="card" style="margin-bottom:10px"><h3>Now: public research</h3><ul>'+D.later.now.map(function(u){return '<li>'+esc(u)+'</li>'}).join("")+'</ul></div><div class="card"><h3>After: with TCL data</h3><ul>'+D.later.after.map(function(u){return '<li>'+esc(u)+'</li>'}).join("")+'</ul></div>'}
  else{
    Object.keys(D.sources).forEach(function(k){sref(k)});
    h+='<div class="card"><ol style="margin:0;padding-left:22px">'+order.map(function(k){var s=D.sources[k];return '<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>'}).join("")+'</ol></div>';
  }
  return h;
}

// pre-seed source numbers in a stable order
Object.keys(D.sources).forEach(sref);
var R={lineup:lineup,compare:compare,grow:grow,voice:voice,traps:traps,method:method};
function route(){
  var p=(location.hash||"#/").replace(/^#\/?/,"").split("/");var v=p[0]||"home";
  if(v!=="home"&&!R[v])v="home";
  nav(v);
  $("view").innerHTML=v==="home"?home():R[v](p[1]);
  window.scrollTo(0,0);
  var sel=document.querySelector('.sub [aria-current="true"]');if(sel&&sel.scrollIntoView)try{sel.scrollIntoView({inline:"center",block:"nearest"})}catch(e){}
}
window.addEventListener("hashchange",route);route();
})();
</script>
</body>
</html>
